name: Plugin preflight

on:
  push:
    branches: [main, codex/plugin-preflight]
  pull_request:
  workflow_dispatch:

jobs:
  flake8:
    name: Flake8 and syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flake8==7.4.1
      - run: python scripts/static_check.py
      - run: >-
          python -m flake8 . --max-line-length=160 --extend-ignore=E203
          --per-file-ignores=processes/raster_styler/distance.py:E501,processes/raster_styler/slope.py:E501,processes/raster_styler/utils.py:E501

  zip-security:
    name: ZIP, security and Qt6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flake8==7.4.1 bandit==1.9.4 detect-secrets==1.5.0
      - run: python scripts/build_plugin_zip.py
      - run: python scripts/preflight_plugin_zip.py dist/MORIZON_Reloaded_QGIS344_v2.3.1.zip
      - run: python scripts/check_qt6_zip.py dist/MORIZON_Reloaded_QGIS344_v2.3.1.zip

  qgis-import:
    name: QGIS 3.40 module imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_plugin_zip.py
      - run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          -e QT_QPA_PLATFORM=offscreen
          -e XDG_CACHE_HOME=/tmp/morizon-qgis-cache
          -e MPLCONFIGDIR=/tmp/morizon-mpl-cache
          debian:trixie bash -lc
          'apt-get update && apt-get install -y python3-qgis qgis-providers python3-gdal &&
          /usr/bin/python3 scripts/qgis_import_smoke.py dist/MORIZON_Reloaded_QGIS344_v2.3.1.zip'
